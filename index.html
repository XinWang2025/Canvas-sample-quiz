<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>General Science Live Quiz</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --correct: #16a34a;
      --incorrect: #dc2626;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      overflow-y: auto;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 14px;
      margin-bottom: 20px;
    }
    h1 { font-size: 1.35rem; margin: 0; }
    .tabs { display: flex; gap: 8px; }
    .tab-btn {
      padding: 8px 14px;
      border: 1px solid var(--border);
      background: #f1f5f9;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.875rem;
    }
    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .field-group { margin-bottom: 20px; }
    label.block-label { display: block; font-weight: 600; margin-bottom: 6px; }
    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
    }
    .question-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
      background: #fcfdff;
    }
    .question-title { font-weight: 600; margin: 0 0 12px 0; }
    .option-label {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 8px;
      cursor: pointer;
      background: #fff;
      transition: border-color 0.15s;
    }
    .option-label:hover { border-color: var(--primary); }
    .submit-btn {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .submit-btn:hover { background: var(--primary-hover); }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .banner {
      padding: 12px 16px;
      border-radius: 8px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1e40af;
      margin-bottom: 16px;
      font-weight: 600;
    }
    .section-title { font-size: 1.05rem; margin: 20px 0 10px 0; }
    .breakdown-item { margin-bottom: 16px; }
    .breakdown-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.875rem;
      margin-bottom: 6px;
    }
    .bar-track {
      display: flex;
      height: 22px;
      border-radius: 6px;
      overflow: hidden;
      background: #e2e8f0;
    }
    .bar-correct {
      background: var(--correct);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: width 0.4s ease;
    }
    .bar-incorrect {
      background: var(--incorrect);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: width 0.4s ease;
    }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); }
    th { font-size: 0.8rem; text-transform: uppercase; color: var(--muted); }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .rank-1 { background: #fef08a; color: #854d0e; }
    .rank-2 { background: #e2e8f0; color: #334155; }
    .rank-3 { background: #fed7aa; color: #9a3412; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>General Science Quick Check</h1>
      <div class="tabs">
        <button id="tab-quiz" class="tab-btn active" onclick="switchView('quiz')">Take Quiz</button>
        <button id="tab-results" class="tab-btn" onclick="switchView('results')">Live Results &amp; Leaderboard</button>
      </div>
    </div>

    <!-- QUIZ VIEW -->
    <div id="view-quiz">
      <form id="quiz-form">
        <div class="field-group">
          <label class="block-label" for="student-name">Display Name / Nickname</label>
          <input type="text" id="student-name" placeholder="e.g., Ada L." required maxlength="30" />
        </div>
        <div id="questions-container"></div>
        <button type="submit" id="submit-btn" class="submit-btn">Submit Answers</button>
      </form>
    </div>

    <!-- RESULTS VIEW -->
    <div id="view-results" class="hidden">
      <div id="personal-score-banner" class="banner hidden"></div>
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2 class="section-title" style="margin:0;">Per-Question Class Accuracy</h2>
        <span id="response-count" style="font-size:0.85rem; color:var(--muted);">0 responses</span>
      </div>
      <div id="accuracy-container" style="margin-top:12px;"></div>

      <h2 class="section-title">Live Class Leaderboard</h2>
      <table>
        <thead>
          <tr>
            <th style="width:70px;">Rank</th>
            <th>Student</th>
            <th style="width:100px;">Score</th>
          </tr>
        </thead>
        <tbody id="leaderboard-body">
          <tr><td colspan="3" style="color:var(--muted);">Waiting for submissions...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // REPLACE THIS WITH YOUR GOOGLE APPS SCRIPT WEB APP URL
    const API_URL = 'https://script.google.com/macros/s/AKfycbxwnIOWx5xKTLb6nyrFuhQGhdAYKL28A27cRWwweMuXS5ui4Lq0Z-DjgsVFb3fbF-uZ/exec';

    const QUESTIONS = [
      {
        prompt: '1. Which organelle is primarily responsible for producing ATP in eukaryotic cells?',
        options: ['Ribosome', 'Mitochondria', 'Golgi apparatus', 'Lysosome'],
        correctIndex: 1
      },
      {
        prompt: '2. Which gas makes up approximately 78% of Earth\'s atmosphere?',
        options: ['Oxygen', 'Carbon dioxide', 'Nitrogen', 'Argon'],
        correctIndex: 2
      },
      {
        prompt: '3. What happens to the boiling point of water as altitude increases and atmospheric pressure decreases?',
        options: ['It decreases', 'It increases', 'It stays at exactly 100°C', 'Water freezes instead of boiling'],
        correctIndex: 0
      }
    ];

    let pollInterval = null;

    function renderQuestions() {
      const container = document.getElementById('questions-container');
      container.innerHTML = QUESTIONS.map((q, qIdx) => `
        <div class="question-card">
          <p class="question-title">${q.prompt}</p>
          ${q.options.map((opt, oIdx) => `
            <label class="option-label">
              <input type="radio" name="q${qIdx}" value="${oIdx}" required />
              <span>${opt}</span>
            </label>
          `).join('')}
        </div>
      `).join('');
    }

    function switchView(view) {
      const isQuiz = view === 'quiz';
      document.getElementById('view-quiz').classList.toggle('hidden', !isQuiz);
      document.getElementById('view-results').classList.toggle('hidden', isQuiz);
      document.getElementById('tab-quiz').classList.toggle('active', isQuiz);
      document.getElementById('tab-results').classList.toggle('active', !isQuiz);

      if (!isQuiz) {
        fetchLiveResults();
        if (!pollInterval) {
          pollInterval = setInterval(fetchLiveResults, 5000);
        }
      } else if (pollInterval) {
        clearInterval(pollInterval);
        pollInterval = null;
      }
    }

    document.getElementById('quiz-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = 'Submitting...';

      const studentName = document.getElementById('student-name').value.trim();
      const answers = QUESTIONS.map((_, idx) => {
        const selected = document.querySelector(`input[name="q${idx}"]:checked`);
        return selected ? Number(selected.value) : -1;
      });

      try {
        // Use text/plain to prevent CORS preflight OPTIONS errors with Google Apps Script
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ studentName, answers })
        });
        const result = await res.json();
        const banner = document.getElementById('personal-score-banner');
        banner.textContent = `Submitted! You scored ${result.score} / ${QUESTIONS.length * 100} points.`;
        banner.classList.remove('hidden');
        switchView('results');
      } catch (err) {
        alert('Error submitting quiz. Verify that API_URL is configured properly.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Submit Answers';
      }
    });

    async function fetchLiveResults() {
      if (!API_URL || API_URL.includes('YOUR_GOOGLE_APPS_SCRIPT')) return;
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        renderResults(data);
      } catch (err) {
        console.error('Failed to refresh live results:', err);
      }
    }

    function renderResults(data) {
      document.getElementById('response-count').textContent = `${data.totalResponses} student response${data.totalResponses === 1 ? '' : 's'}`;

      const accuracyHtml = QUESTIONS.map((q, idx) => {
        const stats = data.breakdown[idx] || { correctCount: 0, incorrectCount: 0 };
        const total = stats.correctCount + stats.incorrectCount;
        const correctPct = total > 0 ? Math.round((stats.correctCount / total) * 100) : 0;
        const incorrectPct = total > 0 ? 100 - correctPct : 0;

        return `
          <div class="breakdown-item">
            <div class="breakdown-meta">
              <span><strong>Q${idx + 1}:</strong> ${q.prompt.replace(/^\d+\.\s*/, '')}</span>
              <span>${stats.correctCount} Correct / ${stats.incorrectCount} Incorrect</span>
            </div>
            <div class="bar-track">
              ${total === 0
                ? '<div style="width:100%; text-align:center; font-size:0.75rem; line-height:22px; color:#64748b;">No responses yet</div>'
                : `
                  <div class="bar-correct" style="width:${correctPct}%">${correctPct > 12 ? correctPct + '%' : ''}</div>
                  <div class="bar-incorrect" style="width:${incorrectPct}%">${incorrectPct > 12 ? incorrectPct + '%' : ''}</div>
                `}
            </div>
          </div>
        `;
      }).join('');
      document.getElementById('accuracy-container').innerHTML = accuracyHtml;

      const tbody = document.getElementById('leaderboard-body');
      if (!data.leaderboard || data.leaderboard.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" style="color:var(--muted);">No submissions yet.</td></tr>';
        return;
      }

      tbody.innerHTML = data.leaderboard.map((entry, idx) => {
        const rank = idx + 1;
        const badgeClass = rank <= 3 ? `rank-${rank}` : '';
        return `
          <tr>
            <td><span class="badge ${badgeClass}">#${rank}</span></td>
            <td>${escapeHtml(entry.name)}</td>
            <td><strong>${entry.score}</strong></td>
          </tr>
        `;
      }).join('');
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    renderQuestions();
  </script>
</body>
</html>
